<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>신규 관람권 현황</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 22px 14px 48px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .sub { color: #6b7280; font-size: 14px; margin-bottom: 16px; }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0 18px;
    }
    .summary > div {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .summary b { display:block; font-size:20px; margin-top:2px; }
    .toolbar {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;
    }
    button {
      border:1px solid #d1d5db;
      background:#fff;
      border-radius:9px;
      padding:8px 11px;
      font-size:14px;
      cursor:pointer;
    }
    button:hover { background:#f3f4f6; }
    .list { display:flex; flex-direction:column; gap:8px; }
    .coupon {
      display:grid;
      grid-template-columns: 28px 1fr auto;
      gap:10px;
      align-items:center;
      padding:12px;
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:#fff;
    }
    .coupon.used { background:#f9fafb; opacity:.67; }
    .coupon.used .main,
    .coupon.used .meta { text-decoration: line-through; }
    .main { font-weight:700; font-size:16px; }
    .barcode { font-variant-numeric: tabular-nums; letter-spacing:.6px; }
    .meta { margin-top:4px; color:#6b7280; font-size:13px; }
    .badge {
      font-size:12px;
      color:#374151;
      background:#f3f4f6;
      border-radius:999px;
      padding:5px 8px;
      white-space:nowrap;
    }
    .empty { padding:22px 4px; text-align:center; color:#6b7280; }
    .note { margin-top:15px; color:#6b7280; font-size:12px; line-height:1.5; }
    input[type="checkbox"] { width:20px; height:20px; cursor:pointer; }
    @media (max-width:520px) {
      .summary { grid-template-columns:1fr 1fr 1fr; }
      .coupon { grid-template-columns:28px 1fr; }
      .badge { grid-column:2; justify-self:start; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>신규 관람권 현황</h1>
    <div class="sub" id="updated">불러오는 중...</div>

    <div class="summary">
      <div>전체<b id="total">0</b></div>
      <div>미사용<b id="active">0</b></div>
      <div>사용완료<b id="used">0</b></div>
    </div>

    <div class="toolbar">
      <button id="showAll">전체 보기</button>
      <button id="showActive">미사용만</button>
      <button id="showUsed">사용완료만</button>
    </div>

    <div class="list" id="list"></div>

    <div class="note">
      페이지에는 전체 바코드가 아니라 앞 4자리와 뒷 6자리만 표시합니다.
      체크 상태는 이 브라우저의 localStorage에 저장되므로 같은 기기·같은 브라우저에서는 페이지를 다시 열어도 유지됩니다.
    </div>
  </div>
</div>

<script>
let coupons = [];
let mode = "all";
const USED_KEY = "coupon-dashboard-used-v1";

function loadUsed() {
  try { return JSON.parse(localStorage.getItem(USED_KEY) || "{}"); }
  catch (_) { return {}; }
}
function saveUsed(used) {
  localStorage.setItem(USED_KEY, JSON.stringify(used));
}
function isUsed(id) {
  const used = loadUsed();
  return !!used[id];
}
function setUsed(id, value) {
  const used = loadUsed();
  if (value) used[id] = true;
  else delete used[id];
  saveUsed(used);
  render();
}
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const usedMap = loadUsed();

  const total = coupons.length;
  const usedCount = coupons.filter(c => usedMap[c.id]).length;
  document.getElementById("total").textContent = total;
  document.getElementById("used").textContent = usedCount;
  document.getElementById("active").textContent = total - usedCount;

  const filtered = coupons.filter(c => {
    const u = !!usedMap[c.id];
    if (mode === "active") return !u;
    if (mode === "used") return u;
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">표시할 관람권이 없습니다.</div>';
    return;
  }

  for (const c of filtered) {
    const used = !!usedMap[c.id];
    const row = document.createElement("div");
    row.className = "coupon" + (used ? " used" : "");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = used;
    check.setAttribute("aria-label", "사용완료");
    check.addEventListener("change", () => setUsed(c.id, check.checked));

    const body = document.createElement("div");
    const main = document.createElement("div");
    main.className = "main";
    main.innerHTML = `<span class="barcode">${escapeHtml(c.first4 || "")}••••••${escapeHtml(c.last6 || "")}</span>`;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [c.merchant, c.title, c.expiry].filter(Boolean).join(" · ");
    body.append(main, meta);

    const badge = document.createElement("div");
    badge.className = "badge";
    badge.textContent = used ? "사용완료" : "미사용";

    row.append(check, body, badge);
    list.appendChild(row);
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  })[m]);
}

document.getElementById("showAll").onclick = () => { mode="all"; render(); };
document.getElementById("showActive").onclick = () => { mode="active"; render(); };
document.getElementById("showUsed").onclick = () => { mode="used"; render(); };

fetch("./coupons.json", {cache:"no-store"})
  .then(r => {
    if (!r.ok) throw new Error("coupons.json을 불러오지 못했습니다.");
    return r.json();
  })
  .then(data => {
    coupons = Array.isArray(data.coupons) ? data.coupons : [];
    document.getElementById("updated").textContent =
      "업데이트: " + (data.updated_at || "시간 정보 없음");
    render();
  })
  .catch(err => {
    document.getElementById("updated").textContent = "데이터 로드 실패";
    document.getElementById("list").innerHTML =
      `<div class="empty">${escapeHtml(err.message)}</div>`;
  });
</script>
</body>
</html>
